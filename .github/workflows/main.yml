# .github/workflows/main.yml
name: Workflow Exemplo

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 * * * *'  # A cada hora

jobs:
  exemplo:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v3  # Action pré-existente do GitHub

      - name: Configurar Node.js
        uses: actions/setup-node@v3  # Outra action pré-existente
        with:
          node-version: '18'

      - name: Executar script personalizado
        run: |
          echo "Olá, este é um script personalizado!"
          date
